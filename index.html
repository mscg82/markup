<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Markup – draw over an image</title>
<meta name="theme-color" content="#2b3135">
<link rel="icon" href="img/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="img/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="img/icon-512.png" type="image/png" sizes="512x512">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="g">
    <label class="btn" title="Open an image to use as background">Open image<input id="file" type="file" accept="image/*" hidden></label>
    <button id="undo" disabled title="Undo last operation (Ctrl+Z)">Undo</button>
    <button id="clear" disabled title="Click: clear drawing. Hold: also remove the image.">Clear</button>
  </div>
  <div class="g" id="tools" role="group" aria-label="Tools">
    <button data-t="pen" aria-pressed="true" title="Pen – freehand drawing" aria-label="Pen"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
    <button data-t="line" aria-pressed="false" title="Line – straight line" aria-label="Line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg></button>
    <button data-t="rect" aria-pressed="false" title="Rectangle – drag from corner to corner" aria-label="Rectangle"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
    <button data-t="circle" aria-pressed="false" title="Circle – drag from the center outward" aria-label="Circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
    <button data-t="erase" aria-pressed="false" title="Eraser – removes only your drawing" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="M3 16l9-9 6 6-7 7H6z"/><path d="M9 10l6 6"/><path d="M13 20h8"/></svg></button>
  </div>
  <div class="g gw">
    <div class="cp" id="cp">
      <button id="colorBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Custom color" title="Custom color"><span id="colorChip"></span></button>
      <input id="color" type="hidden" value="#e63946">
      <div id="cpPop" role="dialog" aria-label="Choose a color" hidden>
        <div id="cpSv" class="cp-sv" tabindex="0" role="slider" aria-label="Saturation and brightness"><div id="cpSvKnob" class="cp-knob"></div></div>
        <div id="cpHue" class="cp-hue" tabindex="0" role="slider" aria-label="Hue"><div id="cpHueKnob" class="cp-knob"></div></div>
        <div class="cp-row"><span id="cpPrev" class="cp-prev"></span><input id="cpHex" type="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex color"></div>
      </div>
    </div>
    <div id="sw" class="sw" role="group" aria-label="Quick colors"></div>
    <input id="width" type="range" min="1" max="80" value="6" aria-label="Line width" title="Line width (the eraser has its own width)">
    <span id="wv">6</span>
  </div>
  <div class="g">
    <button data-t="pan" aria-pressed="false" title="Move – drag to pan the image" aria-label="Move"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    <button id="zo" aria-label="Zoom out" title="Zoom out">−</button>
    <button id="fit" aria-label="Fit to screen" title="Fit image to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="zi" aria-label="Zoom in" title="Zoom in">+</button>
  </div>
  <div class="menu" id="exportMenu">
    <button id="exportBtn" class="primary" aria-haspopup="menu" aria-expanded="false" title="Export or import your work">Export&nbsp;▾</button>
    <div id="menuList" role="menu" hidden>
      <button role="menuitem" id="miJpeg" disabled title="Download the result as a JPEG image">Save JPEG</button>
      <button role="menuitem" id="miExport" disabled title="Download the full application status as a JSON file">Export status</button>
      <button role="menuitem" id="miImport" title="Restore the application status from a JSON file">Import status</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hint">Open an image to start drawing on it.<br>Pinch or scroll to zoom. Drag with Move, two fingers, Space, or the right mouse button.</div>
  <div id="msg"></div>
  <div id="ver" aria-label="Application version"></div>
</div>
<script src="js/colorpicker.js" defer></script>
<script src="js/markup.js" defer></script>
</body>
</html>
