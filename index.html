<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Markup</title>
<meta name="theme-color" content="#2b3135">
<link rel="icon" href="img/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="img/icon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="img/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="img/icon-512.png" type="image/png" sizes="512x512">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="g">
    <div class="row">
    <div class="menu" id="mainMenu">
      <button id="menuBtn" aria-haspopup="menu" aria-expanded="false" data-i18n-aria-label="menu.button" data-i18n-title="menu.button"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div id="menuList" role="menu" hidden>
        <button role="menuitem" id="miNew" aria-haspopup="menu" aria-expanded="false"><span data-i18n="menu.new"></span><span class="chev" aria-hidden="true">▸</span></button>
        <div id="subNew" class="sub" role="menu" hidden>
          <button role="menuitem" id="miOpen" data-i18n="menu.openImage" data-i18n-title="menu.openImage.title"></button>
          <button role="menuitem" id="miEmpty" data-i18n="menu.emptyImage" data-i18n-title="menu.emptyImage.title"></button>
        </div>
        <hr role="separator">
        <button role="menuitem" id="miResize" aria-haspopup="menu" aria-expanded="false"><span data-i18n="menu.resize"></span><span class="chev" aria-hidden="true">▸</span></button>
        <div id="subResize" class="sub" role="menu" hidden>
          <button role="menuitem" id="miFrame" data-i18n="menu.resizeFrame" data-i18n-title="menu.resizeFrame.title"></button>
          <button role="menuitem" id="miScale" data-i18n="menu.resizeBg" data-i18n-title="menu.resizeBg.title"></button>
        </div>
        <hr role="separator">
        <button role="menuitem" id="miJpeg" disabled data-i18n="menu.saveJpeg" data-i18n-title="menu.saveJpeg.title"></button>
        <hr role="separator">
        <button role="menuitem" id="miSnap" aria-haspopup="menu" aria-expanded="false"><span data-i18n="menu.snapshots"></span><span class="chev" aria-hidden="true">▸</span></button>
        <div id="subSnap" class="sub" role="menu" hidden>
          <button role="menuitem" id="miSnapNew" disabled data-i18n="menu.snapNew" data-i18n-title="menu.snapNew.title"></button>
          <button role="menuitem" id="miSnapList" disabled aria-haspopup="menu" aria-expanded="false" data-i18n-title="menu.snapList.title"><span data-i18n="menu.snapList"></span><span class="chev" aria-hidden="true">▸</span></button>
        </div>
        <hr role="separator">
        <button role="menuitem" id="miExport" disabled data-i18n="menu.exportStatus" data-i18n-title="menu.exportStatus.title"></button>
        <button role="menuitem" id="miImport" data-i18n="menu.importStatus" data-i18n-title="menu.importStatus.title"></button>
        <hr role="separator">
        <button role="menuitem" id="miSettings" data-i18n="menu.settings" data-i18n-title="menu.settings.title"></button>
        <hr role="separator">
        <button role="menuitem" id="miReload" data-i18n="menu.reload" data-i18n-title="menu.reload.title"></button>
      </div>
      <div id="snapPop" role="menu" data-i18n-aria-label="menu.snapList" hidden></div>
      <input id="file" type="file" accept="image/*" hidden>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    </div>
    <div class="row">
    <button id="undo" disabled data-i18n-title="undo.title" data-i18n-aria-label="undo.label"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="redo" disabled data-i18n-title="redo.title" data-i18n-aria-label="redo.label"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="row">
    <button id="clear" disabled data-i18n="clear.label" data-i18n-title="clear.title"></button>
    </div>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="g" id="tools" role="group" data-i18n-aria-label="tools.label">
    <div class="row">
    <button data-t="pen" aria-pressed="true" data-i18n-title="tool.pen.title" data-i18n-aria-label="tool.pen.label"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
    <button data-t="fill" aria-pressed="false" data-i18n-title="tool.fill.title" data-i18n-aria-label="tool.fill.label"><svg viewBox="0 0 24 24"><path d="M6 10l6-6 7 7-6 6a2 2 0 0 1-2.8 0L6 12.8a2 2 0 0 1 0-2.8z"/><path d="M6.5 10.5h11"/><path d="M20 15s-2 2.4-2 3.6a2 2 0 0 0 4 0C22 17.4 20 15 20 15z"/></svg></button>
    </div>
    <div class="row">
    <div class="menu" id="shapesMenu">
      <button id="shapesBtn" aria-haspopup="menu" aria-expanded="false" aria-pressed="false" data-i18n-aria-label="tool.shapes.label" data-i18n-title="tool.shapes.title"><span id="shapesIcon"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg></span></button>
      <div id="shapesList" role="menu" hidden>
        <button role="menuitem" data-t="line" aria-pressed="false" data-i18n-title="tool.line.title"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/></svg><span data-i18n="tool.line.label"></span></button>
        <button role="menuitem" data-t="arrow" aria-pressed="false" data-i18n-title="tool.arrow.title"><svg viewBox="0 0 24 24"><path d="M4.5 19.5L15 9"/><path d="M20 4l-2.7 7.2-4.5-4.5z" fill="currentColor"/></svg><span data-i18n="tool.arrow.label"></span></button>
        <button role="menuitem" data-t="rect" aria-pressed="false" data-i18n-title="tool.rect.title"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><span data-i18n="tool.rect.label"></span></button>
        <button role="menuitem" data-t="circle" aria-pressed="false" data-i18n-title="tool.circle.title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg><span data-i18n="tool.circle.label"></span></button>
        <button role="menuitem" data-t="star" aria-pressed="false" data-i18n-title="tool.star.title"><svg viewBox="0 0 24 24"><path d="M12.0 2.8 L14.2 9.7 L21.5 9.7 L15.6 14.0 L17.9 20.9 L12.0 16.6 L6.1 20.9 L8.4 14.0 L2.5 9.7 L9.8 9.7 Z"/></svg><span data-i18n="tool.star.label"></span></button>
      </div>
    </div>
    <button data-t="erase" aria-pressed="false" data-i18n-title="tool.erase.title" data-i18n-aria-label="tool.erase.label"><svg viewBox="0 0 24 24"><path d="M3 16l9-9 6 6-7 7H6z"/><path d="M9 10l6 6"/><path d="M13 20h8"/></svg></button>
    </div>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="g gw">
    <div id="cp"></div>
    <input id="color" type="hidden" value="#e63946">
    <div id="sw" class="sw" role="group" data-i18n-aria-label="colors.quick"></div>
    <input id="width" type="range" min="1" max="80" value="6" data-i18n-aria-label="width.label" data-i18n-title="width.title">
    <span id="wv">6</span>
    <div class="menu" id="widthMenu">
      <button id="widthBtn" aria-haspopup="dialog" aria-expanded="false" data-i18n-aria-label="width.label" data-i18n-title="width.title"><svg viewBox="0 0 24 24"><path d="M4 6h16" stroke-width="1"/><path d="M4 12h16" stroke-width="2.5"/><path d="M4 18.5h16" stroke-width="4.5"/></svg><span id="wvBtn">6</span></button>
      <div id="widthPop" role="group" data-i18n-aria-label="width.label" hidden>
        <input id="widthL" type="range" min="1" max="80" value="6" data-i18n-aria-label="width.label">
        <span id="wvPop">6</span>
      </div>
    </div>
  </div>
  <div class="sep" aria-hidden="true"></div>
  <div class="g">
    <div class="row">
    <button id="layoutBtn" type="button" aria-label="Toolbar position"></button>
    <button data-t="pan" aria-pressed="false" data-i18n-title="tool.pan.title" data-i18n-aria-label="tool.pan.label"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
    </div>
    <div class="row">
    <button id="zo" data-i18n-aria-label="zoom.out" data-i18n-title="zoom.out">−</button>
    <button id="fit" data-i18n-aria-label="zoom.fit.label" data-i18n-title="zoom.fit.title"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="zi" data-i18n-aria-label="zoom.in" data-i18n-title="zoom.in">+</button>
    </div>
  </div>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <button id="moveBtn" class="mv" hidden data-i18n-title="tool.moveShape.title" data-i18n-aria-label="tool.moveShape.label"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
  <button id="hA" class="mv hd" hidden></button>
  <button id="hB" class="mv hd" hidden></button>
  <div id="hint"><span data-i18n="hint.start"></span><span data-i18n="hint.nav"></span></div>
  <div id="msg"></div>
  <div id="dim" data-i18n-aria-label="app.imageSizeLabel"></div>
  <div id="ver" data-i18n-aria-label="app.versionLabel"></div>
</div>
<dialog id="newDlg" aria-labelledby="newTitle">
  <h2 id="newTitle" tabindex="-1" autofocus data-i18n="newdlg.title"></h2>
  <div class="dlg-row">
    <label><span data-i18n="newdlg.width"></span><input id="newW" type="number" inputmode="numeric" min="16" max="2400" value="1600"></label>
    <label><span data-i18n="newdlg.height"></span><input id="newH" type="number" inputmode="numeric" min="16" max="2400" value="1200"></label>
  </div>
  <div class="dlg-label" data-i18n="newdlg.color"></div>
  <div id="newCp"></div>
  <input id="newColor" type="hidden" value="#ffffff">
  <p id="newErr" class="dlg-err" hidden></p>
  <div class="dlg-actions"><button id="newCancel" type="button" data-i18n="common.cancel"></button><button id="newOk" type="button" class="primary" data-i18n="newdlg.create"></button></div>
</dialog>
<dialog id="scaleDlg" aria-labelledby="scaleTitle">
  <h2 id="scaleTitle" tabindex="-1" data-i18n="scaledlg.title"></h2>
  <p id="scaleCur" class="dlg-note"></p>
  <div class="dlg-row">
    <label><span data-i18n="newdlg.width"></span><input id="scW" type="number" inputmode="numeric" min="16" max="2400"></label>
    <label><span data-i18n="newdlg.height"></span><input id="scH" type="number" inputmode="numeric" min="16" max="2400"></label>
  </div>
  <label class="chk"><input id="scKeep" type="checkbox" checked><span data-i18n="scaledlg.keep"></span></label>
  <p id="scaleErr" class="dlg-err" hidden></p>
  <div class="dlg-actions"><button id="scaleCancel" type="button" data-i18n="common.cancel"></button><button id="scaleOk" type="button" class="primary" data-i18n="scaledlg.apply"></button></div>
</dialog>
<dialog id="frameDlg" aria-labelledby="frameTitle">
  <h2 id="frameTitle" tabindex="-1" data-i18n="framedlg.title"></h2>
  <p class="dlg-note" data-i18n="framedlg.note"></p>
  <div class="frame-grid">
    <label class="fg-top"><span data-i18n="framedlg.top"></span><input id="frT" type="number" inputmode="numeric" min="0" max="2400" value="0"></label>
    <label class="fg-left"><span data-i18n="framedlg.left"></span><input id="frL" type="number" inputmode="numeric" min="0" max="2400" value="0"></label>
    <div class="fg-img" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3.5 18l5.5-5.5 4 4 3-3 4.5 4.5"/></svg></div>
    <label class="fg-right"><span data-i18n="framedlg.right"></span><input id="frR" type="number" inputmode="numeric" min="0" max="2400" value="0"></label>
    <label class="fg-bottom"><span data-i18n="framedlg.bottom"></span><input id="frB" type="number" inputmode="numeric" min="0" max="2400" value="0"></label>
  </div>
  <div class="dlg-label" data-i18n="framedlg.color"></div>
  <div id="frameCp"></div>
  <input id="frameColor" type="hidden" value="#ffffff">
  <p id="frameInfo" class="dlg-note"></p>
  <p id="frameErr" class="dlg-err" hidden></p>
  <div class="dlg-actions"><button id="frameCancel" type="button" data-i18n="common.cancel"></button><button id="frameOk" type="button" class="primary" data-i18n="framedlg.apply"></button></div>
</dialog>
<dialog id="nameDlg" aria-labelledby="nameTitle">
  <h2 id="nameTitle"></h2>
  <label class="dlg-label" for="nameInput" data-i18n="namedlg.fileName"></label>
  <div class="name-row"><input id="nameInput" type="text" maxlength="100" spellcheck="false" autocomplete="off"><span id="nameExt" class="dlg-ext"></span></div>
  <p id="nameErr" class="dlg-err" hidden></p>
  <div class="dlg-actions"><button id="nameCancel" type="button" data-i18n="common.cancel"></button><button id="nameOk" type="button" class="primary"></button></div>
</dialog>
<dialog id="snapDlg" aria-labelledby="snapTitle">
  <h2 id="snapTitle" tabindex="-1" data-i18n="snapdlg.title"></h2>
  <label class="dlg-label" for="snapInput" data-i18n="snapdlg.name"></label>
  <input id="snapInput" type="text" maxlength="60" spellcheck="false" autocomplete="off">
  <p id="snapErr" class="dlg-err" hidden></p>
  <div class="dlg-actions"><button id="snapCancel" type="button" data-i18n="common.cancel"></button><button id="snapOk" type="button" class="primary" data-i18n="snapdlg.save"></button></div>
</dialog>
<dialog id="settingsDlg" aria-labelledby="setTitle">
  <h2 id="setTitle" data-i18n="settings.title"></h2>
  <label class="dlg-field"><span data-i18n="settings.language"></span><select id="setLang"></select></label>
  <p class="dlg-note" data-i18n="settings.langNote"></p>
  <div class="dlg-label" data-i18n="settings.newSize"></div>
  <div class="dlg-row">
    <label><span data-i18n="newdlg.width"></span><input id="setW" type="number" inputmode="numeric" min="16" max="2400"></label>
    <label><span data-i18n="newdlg.height"></span><input id="setH" type="number" inputmode="numeric" min="16" max="2400"></label>
  </div>
  <p id="setErr" class="dlg-err" hidden></p>
  <div class="dlg-actions"><button id="setCancel" type="button" data-i18n="common.cancel"></button><button id="setOk" type="button" class="primary" data-i18n="settings.save"></button></div>
</dialog>
<script src="js/i18n.js" defer></script>
<script src="js/colorpicker.js" defer></script>
<script src="js/markup.js" defer></script>
</body>
</html>
